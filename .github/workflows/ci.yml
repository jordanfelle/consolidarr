name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Least privilege by default; only the job that publishes the image gets to write packages.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04 # pinned: ubuntu-latest moves to 26 on 2026-10-19; bump deliberately
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version: "1.27" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: "24", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci && npm run build
        working-directory: web
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  test-postgres:
    runs-on: ubuntu-26.04 # pinned: ubuntu-latest moves to 26 on 2026-10-19; bump deliberately
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_PASSWORD: pw, POSTGRES_DB: consolidarr }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version: "1.27" }
      - run: mkdir -p web/dist && touch web/dist/.gitkeep
      - run: go test -count=1 ./internal/store
        env:
          CONSOLIDARR_TEST_DATABASE_URL: postgres://postgres:pw@localhost:5432/consolidarr?sslmode=disable

  security:
    runs-on: ubuntu-26.04 # pinned: ubuntu-latest moves to 26 on 2026-10-19; bump deliberately
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: "24" }
      - run: npm audit --audit-level=high
        working-directory: web
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          go-version-input: "1.27" # the toolchain the image is built with
          go-package: ./...

  smoke:
    needs: test
    runs-on: ubuntu-26.04 # pinned: ubuntu-latest moves to 26 on 2026-10-19; bump deliberately
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          push: false
          tags: consolidarr:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: scripts/smoke.sh consolidarr:ci

  image:
    needs: [test, test-postgres, security, smoke]
    runs-on: ubuntu-26.04 # pinned: ubuntu-latest moves to 26 on 2026-10-19; bump deliberately
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      # The UI shows this and links it to the exact commit (or the release for a tag).
      - id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="$GITHUB_REF_NAME"; else v="main-${GITHUB_SHA::7}"; fi
          echo "v=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.ver.outputs.v }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
